# Kopia zapasowa Dzik OS na Fly.io (R-12).
#
# Uruchamia wbudowane narzędzie `python -m dzik_os.backup` NA maszynie
# aplikacji (wolumen /data): spójne archiwum bazy (sqlite3 backup API),
# łańcucha audytu (audit.db) i uploadów (w postaci z dysku, czyli
# zaszyfrowanej przy włączonym DZIK_FILE_KEY — klucz przechowuj OSOBNO,
# patrz apps/dzik-os/docs/DEPLOYMENT.md §4a/4b).
#
# Archiwa zostają na wolumenie w /data/backups (retencja: 14 najnowszych);
# drugą, niezależną warstwą są automatyczne snapshoty wolumenów Fly.
# Kopiowanie archiwów POZA maszynę to osobna decyzja operatora — ten
# workflow celowo niczego nie pobiera z maszyny (dane zdrowotne nie mają
# trafiać do artefaktów GitHub Actions).

name: Kopia zapasowa (Fly.io)

on:
  workflow_dispatch: {}
  schedule:
    # Codziennie 02:30 UTC (04:30 czasu polskiego latem).
    - cron: "30 2 * * *"

concurrency:
  # Ta sama grupa co deploy/reset — operacje na /data nie nakładają się.
  group: fly-deploy
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: dzik-os-panel
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Obudź maszynę (auto-start)
        run: curl -sfS "https://$APP_NAME.fly.dev/api/health"

      - name: Wykonaj kopię zapasową na wolumenie
        run: |
          flyctl ssh console --app "$APP_NAME" \
            -C "env DZIK_BACKUP_DIR=/data/backups python -m dzik_os.backup"

      - name: Lista archiwów na wolumenie
        run: |
          flyctl ssh console --app "$APP_NAME" -C "ls -lh /data/backups"

      - name: Snapshoty wolumenu Fly (druga warstwa)
        run: flyctl volumes list --app "$APP_NAME" || true
