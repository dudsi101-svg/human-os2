# Przeniesienie sekretów konfiguracyjnych na Fly — bez terminala (0.52.0).
#
# Właściciel ustawia w repozytorium (Settings → Secrets and variables →
# Actions) te sekrety, które chce włączyć, i klika Run workflow. Na Fly
# trafiają WYŁĄCZNIE sekrety niepuste — reszta jest pomijana bez błędu,
# więc workflow można uruchamiać wielokrotnie, dokładając kolejne.
#
# Obsługiwane sekrety (nazwy 1:1 jak zmienne aplikacji):
#   Poczta:    DZIK_SMTP_HOST, DZIK_SMTP_PORT, DZIK_SMTP_USER,
#              DZIK_SMTP_PASSWORD, DZIK_SMTP_FROM, DZIK_SMTP_SECURITY
#   Brevo (0.61.0, moduł mailer.py; zakres `brevo`):
#              SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM,
#              MAIL_REPLY_TO — po ustawieniu workflow uruchamia z maszyny
#              `smtp_check.py` (4 kroki) i testową wysyłkę przez Brevo.
#   AI:        DZIK_AI_API_KEY, DZIK_AI_ENABLED
#   Szyfrowanie plików: DZIK_FILE_KEY
#
# Wartości są maskowane w logach Actions; `flyctl secrets set` restartuje
# maszynę, więc nowa konfiguracja działa od razu po zakończeniu.
#
# Input `zakres` (0.54.5): domyślnie przenoszona jest WYŁĄCZNIE poczta —
# wcześniej jeden przebieg „dla poczty” włączyłby też AI albo klucz
# szyfrowania, gdyby ich sekrety leżały w repo. Włączenie AI/szyfrowania
# to osobna, świadoma decyzja (osobne uruchomienie z innym zakresem).

name: Sekrety produkcji (Fly.io)

on:
  workflow_dispatch:
    inputs:
      zakres:
        description: "Które sekrety przenieść na Fly"
        required: true
        type: choice
        default: "poczta"
        options:
          - poczta
          - brevo
          - ai
          - szyfrowanie
          - wszystko
      test_email:
        description: "Adres na testowy e-mail po ustawieniu sekretów (puste = bez testu)"
        required: false
        default: "dudsi101@gmail.com"

concurrency:
  group: fly-maintenance
  cancel-in-progress: false

jobs:
  sekrety:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: dzik-os-panel
      DZIK_SMTP_HOST: ${{ secrets.DZIK_SMTP_HOST }}
      DZIK_SMTP_PORT: ${{ secrets.DZIK_SMTP_PORT }}
      DZIK_SMTP_USER: ${{ secrets.DZIK_SMTP_USER }}
      DZIK_SMTP_PASSWORD: ${{ secrets.DZIK_SMTP_PASSWORD }}
      DZIK_SMTP_FROM: ${{ secrets.DZIK_SMTP_FROM }}
      DZIK_SMTP_SECURITY: ${{ secrets.DZIK_SMTP_SECURITY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
      DZIK_AI_API_KEY: ${{ secrets.DZIK_AI_API_KEY }}
      DZIK_AI_ENABLED: ${{ secrets.DZIK_AI_ENABLED }}
      DZIK_FILE_KEY: ${{ secrets.DZIK_FILE_KEY }}
      # Inputy WYŁĄCZNIE przez env (audyt P0-3): nigdy w bloku run.
      TEST_EMAIL: ${{ inputs.test_email }}
      ZAKRES: ${{ inputs.zakres }}
    steps:
      - name: Zwaliduj inputy (pusty e-mail = bez testu; inaczej twardy wzorzec)
        run: |
          if [ -n "$TEST_EMAIL" ] && ! printf '%s' "$TEST_EMAIL" | grep -qE '^[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "::error::Input test_email nie wygląda jak adres e-mail — odmowa."
            exit 1
          fi
          case "$ZAKRES" in
            poczta|brevo|ai|szyfrowanie|wszystko) ;;
            *) echo "::error::Nieznany zakres: $ZAKRES"; exit 1 ;;
          esac

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master 2026-08 (tag 1.6)

      - name: Ustaw na Fly sekrety, które są wypełnione w repo
        run: |
          POCZTA="DZIK_SMTP_HOST DZIK_SMTP_PORT DZIK_SMTP_USER DZIK_SMTP_PASSWORD DZIK_SMTP_FROM DZIK_SMTP_SECURITY"
          BREVO="SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD MAIL_FROM MAIL_REPLY_TO"
          AI="DZIK_AI_API_KEY DZIK_AI_ENABLED"
          SZYFROWANIE="DZIK_FILE_KEY"
          case "$ZAKRES" in
            poczta) NAZWY="$POCZTA" ;;
            brevo) NAZWY="$BREVO" ;;
            ai) NAZWY="$AI" ;;
            szyfrowanie) NAZWY="$SZYFROWANIE" ;;
            wszystko) NAZWY="$POCZTA $BREVO $AI $SZYFROWANIE" ;;
          esac
          echo "Zakres: $ZAKRES"
          ARGS=()
          USTAWIONE=""
          for n in $NAZWY; do
            v="${!n}"
            if [ -n "$v" ]; then
              ARGS+=("$n=$v")
              USTAWIONE="$USTAWIONE $n"
            fi
          done
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "::error::Żaden sekret z zakresu „$ZAKRES” nie jest ustawiony w repozytorium (oczekiwane nazwy: $NAZWY). Dodaj je w Settings → Secrets and variables → Actions i uruchom ponownie."
            exit 1
          fi
          flyctl secrets set --app "$APP_NAME" "${ARGS[@]}"
          echo "Przeniesione na Fly (wartości ukryte):$USTAWIONE"

      - name: Poczekaj, aż maszyna wstanie po restarcie
        run: |
          for i in $(seq 1 30); do
            curl -sfS "https://$APP_NAME.fly.dev/api/health" && exit 0
            sleep 5
          done
          echo "::error::Maszyna nie wstała w 150 s"; exit 1

      - name: Testowa wysyłka e-maila (dowód, nie wiara)
        if: inputs.test_email != '' && (inputs.zakres == 'poczta' || inputs.zakres == 'wszystko')
        run: |
          flyctl ssh console --app "$APP_NAME" -C \
            "python -m dzik_os.test_poczty $TEST_EMAIL"
          echo "Sprawdź skrzynkę $TEST_EMAIL — powinna być wiadomość „Dzik OS — test poczty”."

      - name: Brevo — sprawdzenie kanału z maszyny (4 kroki) i testowa wysyłka
        if: inputs.zakres == 'brevo' || inputs.zakres == 'wszystko'
        run: |
          flyctl ssh console --app "$APP_NAME" -C "python smtp_check.py"
          if [ -n "$TEST_EMAIL" ]; then
            flyctl ssh console --app "$APP_NAME" -C "python -m dzik_os.test_poczty_brevo $TEST_EMAIL"
            echo "Sprawdź skrzynkę $TEST_EMAIL — powinna być wiadomość „Test wysyłki Dzik OS”."
          fi
