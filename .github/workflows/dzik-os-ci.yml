name: dzik-os-ci

on:
  push:
    branches: [main, develop]
    paths: ["apps/dzik-os/**", "hos_engine/**", ".github/workflows/dzik-os-ci.yml"]
  pull_request:
    paths: ["apps/dzik-os/**", "hos_engine/**", ".github/workflows/dzik-os-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hos_engine + backend
        run: |
          pip install -e ".[dev]"
          pip install -e "apps/dzik-os/backend[dev]"
      - name: Lint (ruff)
        run: ruff check apps/dzik-os/backend apps/dzik-os/tools
      # Audyt B2 (25.08): znana podatność w zainstalowanym środowisku
      # backendu = czerwony build. Wyjątki wyłącznie jawne, tutaj,
      # z komentarzem dlaczego i do kiedy (--ignore-vuln ID).
      - name: Audyt zależności (pip-audit, blokujący)
        # Najpierw aktualny toolchain (setuptools/wheel bywają stare na
        # runnerze i czerwieniłyby audyt niezależnie od naszych zależności),
        # potem audyt tego, co faktycznie zainstalowane.
        run: |
          pip install -U pip setuptools wheel pip-audit
          pip-audit --skip-editable
      - name: Kontrola spójności (kolizje między równoległymi rundami)
        # Wykrywa to, czego git nie widzi: powtórzony numer migracji lub
        # wersji, trasę przesłoniętą przez parametr, router bez
        # include_router, test frontendu spoza test:helpers.
        # Patrz apps/dzik-os/docs/KOORDYNACJA.md
        run: python apps/dzik-os/tools/spojnosc.py

      - name: Core regression tests (hos_engine)
        run: pytest tests/ -q
      - name: Dzik OS backend tests
        run: pytest apps/dzik-os/backend/tests -q

  # Ten sam zestaw testów na PostgreSQL.
  #
  # Audyt 18.08.2026: PostgreSQL był zadeklarowany w `pyproject.toml`, w gałęzi
  # kopii zapasowych i w indeksach częściowych modeli — a nie wykonała się na
  # nim ANI JEDNA linia. Pierwszy przebieg wykazał, czego SQLite nie mógł
  # pokazać: SQLite domyślnie nie egzekwuje kluczy obcych, więc kod potrafił
  # zapisywać rekordy wskazujące na jeszcze nieistniejące wiersze.
  #
  # BLOKUJĄCY od 18.08.2026. Job wszedł jako nieblokujący, na czas dochodzenia
  # do zieloności; warunek zdjęcia flagi brzmiał „stabilnie zielony przebieg".
  # Spełniony: dwa kolejne pełne przebiegi na PostgreSQL zakończyły się
  # powodzeniem (w tym cykl kopia→odtworzenie przez pg_dump/psql, który
  # wymagał naprawy `--clean --if-exists`). Od teraz regres na PG zatrzymuje
  # build tak samo jak na SQLite — inaczej ta bramka tylko raportowałaby
  # w tle i nikt by jej nie czytał.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hos_engine + backend (z PostgreSQL)
        run: |
          pip install -e ".[dev]"
          pip install -e "apps/dzik-os/backend[dev,postgres]"
      - name: Dzik OS backend tests na PostgreSQL
        env:
          DZIK_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/dzik_test
        run: pytest apps/dzik-os/backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Install and build (includes typecheck via tsc -b)
        working-directory: apps/dzik-os/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Dependency audit (informational)
        working-directory: apps/dzik-os/frontend
        run: npm audit --omit=dev || true

  # Testy E2E: jedyna bramka, która sprawdza interfejs w działaniu.
  # Testy jednostkowe frontendu pokrywają wyłącznie funkcje pomocnicze,
  # a testy backendu wołają API z pominięciem przeglądarki — bez tego joba
  # regresja w ekranie logowania czy raportu przechodziła niezauważona.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Install backend
        run: |
          pip install -e ".[dev]"
          pip install -e "apps/dzik-os/backend[dev]"
      - name: Install frontend and build
        working-directory: apps/dzik-os/frontend
        # E2E chodzi po zbudowanym `dist/` serwowanym przez backend,
        # czyli po tej samej ścieżce co produkcja.
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium
        working-directory: apps/dzik-os/frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        working-directory: apps/dzik-os/frontend
        env:
          DZIK_E2E_STAMP: ${{ github.run_id }}
        run: npx playwright test
      # Zestaw dostepnosci/responsywnosci lezy poza Playwrightem (wlasny
      # runner, starszy od playwright.config.ts) i przez to dotad NIE CHODZIL
      # w CI — mimo ze to jedyna bramka lapiaca poziomy scroll na 320 px,
      # etykiety pol, porzadek naglowkow i obsluge zakladek z klawiatury.
      # NODE_PATH: runner szuka `playwright` obok wlasnego pliku i globalnie,
      # a w CI pakiet stoi tylko w node_modules frontendu.
      - name: E2E dostępności i responsywności
        working-directory: apps/dzik-os
        env:
          NODE_PATH: ${{ github.workspace }}/apps/dzik-os/frontend/node_modules
        run: node e2e/test_a11y.mjs
      # Ten sam problem: jedyna bramka sprawdzajaca service workera
      # (precache, "API nigdy w cache", flow aktualizacji bez auto-reloadu)
      # tez nie chodzila w CI. Bez niej zmiana listy precache — np. odsianie
      # nieuzywanych subsetow fontow — nie miala zadnego automatycznego
      # sprawdzenia, ze tryb offline nadal dziala.
      - name: E2E PWA i trybu offline
        working-directory: apps/dzik-os
        env:
          NODE_PATH: ${{ github.workspace }}/apps/dzik-os/frontend/node_modules
        run: node e2e/test_pwa_offline.mjs
      - name: Raport z nieudanego przebiegu
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/dzik-os/frontend/playwright-report
            apps/dzik-os/frontend/test-results
          retention-days: 7
