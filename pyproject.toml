[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hos_engine"]

[project]
name = "human-os-engine"
version = "0.10.0a1"
description = "Reference runtime for the Human OS constitutional protocol and engine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2"
]
app = [
  "flask>=3,<4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# apps/ hosts independent sub-projects (their own pyproject.toml, deps,
# lint/test commands, e.g. apps/dzik-os/backend) — this root config and
# CI job only install and check the Core (hos_engine), so exclude them
# here rather than pick up their separate rule set unintentionally.
extend-exclude = ["apps"]

[tool.mypy]
python_version = "3.11"
strict = true
