<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="description" content="Dzik OS — trening personalny prowadzony w aplikacji: indywidualny plan, dieta, cotygodniowe raporty i stały kontakt z trenerem." />
    <!-- Open Graph / Twitter Card: link wysłany na komunikatorze pokazuje
         markową kartę zamiast gołego adresu. og:image jest statycznym
         plikiem (public/og.png, 1200x630) — podmiana to podmiana pliku. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dzik OS" />
    <meta property="og:title" content="Dzik OS — trening prowadzony, nie zgadywany" />
    <meta property="og:description" content="Indywidualny plan treningowy, dieta, cotygodniowe raporty i stały kontakt z trenerem — w jednej aplikacji." />
    <meta property="og:url" content="https://dzik-os-panel.fly.dev/" />
    <meta property="og:image" content="https://dzik-os-panel.fly.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pl_PL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dzik OS — trening prowadzony, nie zgadywany" />
    <meta name="twitter:description" content="Plan, dieta, raporty i kontakt z trenerem — w jednej aplikacji." />
    <meta name="twitter:image" content="https://dzik-os-panel.fly.dev/og.png" />
    <!-- Fonty (Unbounded, Inter) są self-hostowane przez @fontsource
         (import w src/main.tsx) — zero zapytań do Google Fonts,
         adres IP użytkownika nie trafia do Google. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Dzik OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
