[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dzik_os*"]

[project]
name = "dzik-os-backend"
version = "0.53.12"
description = "Dzik OS — Panel Podopiecznego. Backend domenowy zbudowany na fundamentach Human OS (hos_engine)."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "anthropic>=1.0,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "bcrypt>=4.0,<5",
  "python-multipart>=0.0.9",
  "email-validator>=2",
  "jsonschema>=4.20,<5",
  "openpyxl>=3.1,<4",
  # Przetwarzanie zdjęć na uploadzie: usunięcie EXIF/GPS, limit
  # rozdzielczości, rekompresja (file_safety.process_image).
  "pillow>=12.3,<13",
  "pywebpush>=2,<3",
  # zoneinfo wymaga bazy stref czasowych także na obrazach slim bez tzdata
  "tzdata",
  # Szyfrowanie at-rest plików uploadów (AES-256-GCM) — patrz storage.py / R-02.
  "cryptography>=48.0.1,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27",
  "ruff>=0.5,<1",
]
postgres = [
  "psycopg2-binary>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  # Idiomatyczny wzorzec FastAPI: `Depends(...)` w argumencie domyślnym.
  "B008",
]
