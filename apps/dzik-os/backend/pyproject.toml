[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dzik_os*"]

# Pliki danych pakietów właściciela (konfigurator, Wiedza, kreator dań)
# leżą obok kodu jako JSON. Bez tej deklaracji instalacja NIE-edytowalna
# (obraz produkcyjny: `pip install ./apps/dzik-os/backend`) pomija je —
# 13.09.2026 start aplikacji na Fly zatrzymał się na
# `FileNotFoundError: wiedza/dane/tresci_startowe.json` (10 restartów,
# maszyna zatrzymana). Testy chodzą na instalacji edytowalnej, więc nie
# widziały braku; strażnik: tests/test_pakietowanie.py.
[tool.setuptools.package-data]
"dzik_os.konfigurator" = ["dane/*.json"]
"dzik_os.kulinaria" = ["dane/*.json"]
"dzik_os.wiedza" = ["dane/*.json"]
"dzik_os.dieta" = ["dane/*.json", "dane/*.csv", "dane/szablony/*.json"]

[project]
name = "dzik-os-backend"
version = "0.78.0"
description = "Dzik OS — Panel Podopiecznego. Backend domenowy zbudowany na fundamentach Human OS (hos_engine)."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "anthropic>=1.0,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "bcrypt>=4.0,<5",
  "python-multipart>=0.0.9",
  "email-validator>=2",
  "jsonschema>=4.20,<5",
  "openpyxl>=3.1,<4",
  # Przetwarzanie zdjęć na uploadzie: usunięcie EXIF/GPS, limit
  # rozdzielczości, rekompresja (file_safety.process_image).
  "pillow>=12.3,<13",
  "pywebpush>=2,<3",
  # zoneinfo wymaga bazy stref czasowych także na obrazach slim bez tzdata
  "tzdata",
  # Szyfrowanie at-rest plików uploadów (AES-256-GCM) — patrz storage.py / R-02.
  "cryptography>=48.0.1,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27",
  "ruff>=0.5,<1",
]
postgres = [
  "psycopg2-binary>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  # Idiomatyczny wzorzec FastAPI: `Depends(...)` w argumencie domyślnym.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# Moduł poczty Brevo dostarczony przez właściciela (docs/mail, 0.61.0) —
# kopiowany 1:1, bez zmian logiki i stylu; test ma tylko poprawione importy.
"dzik_os/mailer.py" = ["UP035", "RUF022", "S110", "BLE001"]
"smtp_check.py" = ["I001", "EXE001"]
"tests/test_mailer.py" = ["I001", "C408", "RUF012", "UP041"]
