# Fly.io — konfiguracja Dzik OS (staging na darmowej subdomenie *.fly.dev
# z automatycznym HTTPS; własna domena do podpięcia później jednym
# poleceniem `flyctl certs add panel.twojadomena.pl`).
#
# Deployment Z KORZENIA repozytorium (kontekst budowania musi zawierać
# hos_engine):  flyctl deploy --config apps/dzik-os/fly.toml
# Pełna instrukcja: apps/dzik-os/docs/DEPLOYMENT.md §PaaS.

app = "dzik-os-panel"
primary_region = "fra"   # Frankfurt (najbliższy region Fly dla Polski)

# Uwaga: Dockerfile i kontekst budowania są przekazywane w wierszu poleceń
# (patrz .github/workflows/fly-deploy.yml) — kontekstem musi być korzeń
# repozytorium, bo obraz kopiuje pakiet hos_engine.

[env]
  DZIK_ENV = "staging"
  # Start na SQLite na trwałym wolumenie — zero dodatkowych usług.
  # Produkcyjnie: Fly Postgres + secret DZIK_DATABASE_URL (DEPLOYMENT.md).
  DZIK_DATABASE_URL = "sqlite:////data/dzik.db"
  DZIK_AUDIT_DB = "/data/audit.db"
  DZIK_UPLOAD_DIR = "/data/uploads"
  # STAGING: przy pierwszym starcie zasiewa syntetyczne konta demo.
  # Przy przejściu na produkcję z prawdziwymi klientami USUŃ tę linię.
  DZIK_SEED_DEMO = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1 maszyna zawsze aktywna: pętla przypomnień push (reminder_loop.py)
  # musi działać także, gdy nikt nie ma otwartej aplikacji. Uwaga: to
  # wychodzi poza w pełni darmowy tryb Fly (maszyna nie usypia) — koszt
  # rzędu kilku USD/mies. przy shared-cpu-1x.
  min_machines_running = 1

[[mounts]]
  source = "dzik_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB, nie 512 MB. Pomiar na tej wersji aplikacji: 124 MB po starcie,
  # 129 MB po ruchu klienta, a obróbka jednego zdjęcia 2560x1920 w Pillow
  # kosztuje ~75 MB szczytowo (OCR na zmniejszonym obrazie tyle samo).
  # Pojedyncza operacja mieści się w 512 MB, ale nałożenie uploadu zdjęć
  # raportu na rozpoznawanie tekstu i pętlę przypomnień już niekoniecznie —
  # a Fly nie ma swapa, więc przekroczenie limitu to ubicie maszyny, nie
  # spowolnienie. Różnica w koszcie to ok. 2-3 USD/mies.
  memory = "1024mb"
